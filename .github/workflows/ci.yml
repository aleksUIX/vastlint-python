name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and package tooling
        run: python -m pip install pytest build twine
      - name: Verify bundled libraries and notices
        run: python scripts/check-native.py
      - name: Test the packaged runtime
        run: PYTHONPATH=src python -m pytest tests -q
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
